name: Wayland transfer tests

on:
  pull_request:
    paths:
      - 'winit-wayland/**'
      - '.github/workflows/wayland-transfer.yml'
  push:
    branches: [codex/winit-wayland-drop-review]

permissions:
  contents: read

jobs:
  wayland-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        portal: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Wayland test dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libdbus-1-dev
      - name: Test Wayland backend logic
        if: ${{ !matrix.portal }}
        run: cargo test -p winit-wayland --lib
      - name: Test Wayland backend with portal support
        if: ${{ matrix.portal }}
        run: cargo test -p winit-wayland --lib --features portal
