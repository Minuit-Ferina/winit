name: AppKit test preview

on:
  push:
    branches: [codex/winit-appkit-test]

permissions:
  contents: read

jobs:
  appkit:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native AppKit backend
        run: cargo test -p winit-appkit --lib
