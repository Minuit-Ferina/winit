name: Native Wayland drag validation

on:
  push:
    branches: [codex/winit-wayland-internal-drag]

permissions:
  contents: read

jobs:
  mutter:
    name: Wayland native drag contract (Mutter)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the compositor and input tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mutter xvfb xauth xdotool dbus-x11 python3-pil scrot libxkbcommon-dev
      - name: Build the Wayland-only demo and test the backend
        run: |
          cargo test -p winit-wayland
          cargo build -p winit --example wayland_internal_drag --no-default-features --features wayland,wayland-dlopen
      - name: Exercise native drag gestures
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- bash .github/validation/wayland-drag.sh
      - name: Upload compositor and client output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayland-drag-logs
          path: ${{ runner.temp }}/winit-wayland-drag
